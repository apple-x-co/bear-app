name: Security

on: [push, pull_request]

jobs:
  security:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./source/app

    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - run: composer install --no-interaction

      - name: Security Scan (bear)
        run: vendor/bin/bear.security-scan src --format sarif > results-bear.sarif

      - name: Upload to GitHub Security (bear)
        uses: github/codeql-action/upload-sarif@v3
        with:
          category: bear
          sarif_file: ./source/app/results-bear.sarif

      - name: Security Scan (ddd)
        run: vendor/bin/bear.security-scan ddd/core/src --format sarif > results-ddd.sarif

      - name: Upload to GitHub Security (ddd)
        uses: github/codeql-action/upload-sarif@v3
        with:
          category: ddd
          sarif_file: ./source/app/results-ddd.sarif
