version: 2
updates:
  - package-ecosystem: composer
    directories:
      - /source/app
      - /source/app/vendor-bin/tools
    schedule:
      interval: weekly
    groups:
      composer-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /source/app/public/admin-src
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
